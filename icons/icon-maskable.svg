<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Engraving hatches: tone is built from ink lines, not gradients. -->
    <pattern id="hMed" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#4a3713" stroke-width="1.2"/>
    </pattern>
    <pattern id="hCross" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#2b2009" stroke-width="1.3"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#2b2009" stroke-width="1.3"/>
    </pattern>
    <pattern id="bgLines" width="7" height="7" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="7" y2="0" stroke="#a9d6e1" stroke-width="0.7"/>
    </pattern>
    <clipPath id="band" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd"
            d="M256,184 a138,138 0 1,0 -0.01,0 Z M256,210 a112,112 0 1,0 -0.01,0 Z"/>
    </clipPath>
  </defs>

  <!-- Background: pale festival blue with a faint engraved line texture -->
  <rect width="512" height="512" fill="#cfe9f0"/>
  <rect width="512" height="512" fill="url(#bgLines)" opacity="0.5"/>

  <g transform="translate(51.2 67.2) scale(0.8)">
  <!-- ===== Chain rising from the bow ===== -->
  <g fill="#e7cf7f" stroke="#2b2310" stroke-width="2.4">
    <circle cx="255" cy="20" r="7" fill="none" stroke-width="3"/>
    <ellipse cx="255" cy="36" rx="4.2" ry="7.5"/>
    <ellipse cx="257" cy="50" rx="7.5" ry="4.2"/>
    <ellipse cx="254" cy="64" rx="4.2" ry="7.5"/>
    <ellipse cx="257" cy="78" rx="7.5" ry="4.2"/>
    <ellipse cx="255" cy="92" rx="4.2" ry="7.5"/>
    <ellipse cx="256" cy="106" rx="7.5" ry="4.2"/>
    <ellipse cx="256" cy="120" rx="4.2" ry="7.5"/>
  </g>

  <!-- ===== Bow + fluted crown ===== -->
  <circle cx="256" cy="150" r="18" fill="#ead98f" stroke="#2b2310" stroke-width="3.5"/>
  <circle cx="256" cy="150" r="18" fill="url(#hMed)" stroke="none"/>
  <circle cx="256" cy="150" r="8" fill="#cfe9f0" stroke="#2b2310" stroke-width="2.4"/>
  <rect x="243" y="167" width="26" height="22" rx="5" fill="#ead98f" stroke="#2b2310" stroke-width="3"/>
  <g stroke="#2b2310" stroke-width="1.6">
    <line x1="250" y1="171" x2="250" y2="185"/>
    <line x1="256" y1="171" x2="256" y2="185"/>
    <line x1="262" y1="171" x2="262" y2="185"/>
  </g>

  <!-- ===== Case band, shaded by hatching ===== -->
  <g clip-path="url(#band)">
    <rect x="118" y="184" width="276" height="276" fill="#ecd98a"/>
    <rect x="118" y="184" width="276" height="276" fill="url(#hMed)"/>
    <!-- deeper shadow toward lower-right -->
    <circle cx="338" cy="404" r="172" fill="url(#hCross)"/>
    <!-- reflection highlight toward upper-left -->
    <circle cx="198" cy="248" r="50" fill="#f7eccb" opacity="0.65"/>
  </g>
  <circle cx="256" cy="322" r="138" fill="none" stroke="#2b2310" stroke-width="4.5"/>
  <circle cx="256" cy="322" r="112" fill="none" stroke="#2b2310" stroke-width="3"/>

  <!-- ===== Dial ===== -->
  <circle cx="256" cy="322" r="110" fill="#f7f1df"/>
  <circle cx="256" cy="322" r="100" fill="none" stroke="#7a6a3c" stroke-width="1.3"/>

  <!-- Roman numerals -->
  <g fill="#241f15" font-family="Georgia, 'Times New Roman', serif" font-size="27"
     text-anchor="middle" dominant-baseline="central" letter-spacing="0.5">
    <text x="256" y="228">XII</text>
    <text x="303" y="240.6">I</text>
    <text x="337.4" y="275">II</text>
    <text x="350" y="322">III</text>
    <text x="337.4" y="369">IIII</text>
    <text x="303" y="403.4">V</text>
    <text x="256" y="416">VI</text>
    <text x="209" y="403.4">VII</text>
    <text x="174.6" y="369">VIII</text>
    <text x="162" y="322">IX</text>
    <text x="174.6" y="275">X</text>
    <text x="209" y="240.6">XI</text>
  </g>

  <!-- Seconds sub-dial -->
  <circle cx="256" cy="376" r="22" fill="#f1e9d0" stroke="#2b2310" stroke-width="2.2"/>
  <g stroke="#6f5f34" stroke-width="1.2">
    <line x1="256" y1="356" x2="256" y2="361"/>
    <line x1="256" y1="391" x2="256" y2="396"/>
    <line x1="236" y1="376" x2="241" y2="376"/>
    <line x1="271" y1="376" x2="276" y2="376"/>
  </g>
  <line x1="256" y1="376" x2="247" y2="389" stroke="#a83a2f" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="256" cy="376" r="2.6" fill="#241f15"/>

  <!-- Hands at the classic 10:10 -->
  <polygon points="256,322 246,300 213,292 250,316" fill="#241f15" stroke="#241f15" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="256,322 262,300 325,282 261,316" fill="#241f15" stroke="#241f15" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="256" cy="322" r="8.5" fill="#ead98f" stroke="#241f15" stroke-width="2.4"/>
  </g>
</svg>
